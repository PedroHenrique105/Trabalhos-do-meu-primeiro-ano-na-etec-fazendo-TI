<script>
    var p = parseInt(prompt(" Entre com o numero final da placa do veiculo"));
    switch(p){
        case 1:
        case 2:
            alert('nao pode segunda-feira')
            break;
        case 3:
        case 4:
            alert('nao pode terça-feira')
            break;
        case 5:
        case 6:
            alert('nao pode quarta-feira')
            break;    
        case 7:
        case 8:
            alert('nao pode quinta-feira')
            break;
        case 9:
        case 0:
            alert('nao pode sexta-feira')
            break;
        default:
            alert("numero invalido")
        
    }
</script>
