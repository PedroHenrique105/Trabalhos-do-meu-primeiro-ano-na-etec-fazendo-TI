<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Registro de Veiculo</title>
</head>
<body>
    
    <h1> Registro de Veículo </h1>


<form action="" method="post" >

<div>
    <div>
        <label for=""> Nome do Proprietário: </label>
    </div>
    <div> 
        <input type="text" placeholder=" Nome "/>
    </div>
</div>

<br>

<div>
    <div>
        <label for=""> Email: </label>
    </div>
    <div>
         <input type="email" placeholder="email"/>
    </div>
</div> 

<br>

<div>
    <div>
        <label for=""> Telefone: </label>
    </div>
    <div> 
        <input type="text" placeholder=" Telefone "/>
    </div>
</div>

<br>

<div>
    <div>
        <label for=""> Data de Nascimento: </label>
    </div>
    <div> 
        <input type="date" />
    </div>
</div>

<br>

<div>
    <div>
        <label for=""> Modelo do Veiculo: </label>
    </div>
    <div> 
        <input type="text" placeholder=" Modelo "/>
    </div>
</div>

<br>

<div>
    <div>
        <label for=""> Fabricante: </label>
    </div>
    <div> 
        <select name="" id="" >
            <option> Fiat </option>
            <option> Jeep </option>
            <option> Peugeot </option>
            <option> Citroën </option>
            <option> RAM </option>
            <option> Alfa Romeo </option>
            <option> Maserati </option>
            <option> Opel </option>
            <option> Volkswagen </option>
            <option> Audi </option>
            <option> Porsche </option>
            <option> Bentley </option>
            <option> Lamborghini </option>
            <option> Skoda </option>
            <option> Seat </option>
            <option> Cupra </option>
            <option> Toyota </option>
            <option> Lexus </option>
            <option> Daihatsu </option>
            <option> Chevrolet </option>
            <option> Cadillac </option>
            <option> Wuling </option>
            <option> Baojun </option>
            <option> GMC </option>
            <option> Renault </option>
            <option> Nissan </option>
            <option> Mitsubishi </option>
            <option> Dacia </option>
            <option> Alpine </option>
            <option> Hyundai </option>
            <option>  Kia </option>
            <option> Genesis </option>
            <option> BMW </option>
            <option> Mini </option>
            <option> Rolls-Royce </option>
            <option> Ford </option>
            <option> Lincoln </option>
            <option> Honda </option>
            <option> Mercedes-Benz </option>
            <option> BYD </option>
            <option> Geely </option>
            <option> Volvo </option>
            <option> Lotus </option>
            <option> Jaguar Land Rover </option>
            <option> Tesla </option>    
        </select>
    </div>
</div>

<br>

<div>
    <div>
        <label for=""> Combustivel: </label>
    </div>
    <div> 
        <input type="radio" name="comb"/> <span> Gasolina </span>
    </div>
    <div>
        <input type="radio" name="comb"/> <span> Álcool </span>
    </div>
    <div>
        <input type="radio" name="comb"/> <span> Diesel </span>
    </div>
    <div>
        <input type="radio" name="comb"/> <span> Elétrico </span>
    </div>
    <div>
        <input type="radio" name="comb"/> <span> Híbrido/Flex </span>
    </div>
</div>

<br>

<div>
    <div>
        <label for=""> Utilidade do Veiculo </label>
    </div>
    <div> 
        <input type="checkbox"/> <span> Passeio </span>
    </div>
    <div> 
        <input type="checkbox"/> <span> Trabalho </span>
    </div>
</div>

<br>

<div> 
    <input type="submit" value=" Enviar "/>
</div>


</form>




</body>
</html>
